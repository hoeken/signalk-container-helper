name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Note generation diffs against the previous tag, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Notes are generated from the merged PRs in the tag range and grouped
          # by .github/release.yml. Commit and PR titles are the release notes —
          # see AGENTS.md "Commit and PR titles".
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # package-lock.json is not committed, so generate one before npm ci --
      # a bare npm ci here would fail with no lockfile present.
      - name: Install
        run: |
          npm install --package-lock-only
          npm ci

      - name: Publish to npm
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$tag" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$tag" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi
