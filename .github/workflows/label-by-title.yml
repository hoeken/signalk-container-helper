name: label-by-title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  # .github/release.yml sorts the release notes by label, and a PR opened from
  # the command line carries none. The label follows the title's
  # conventional-commit type. Only the title is read, with no checkout and
  # nothing from the PR run here, which is what makes pull_request_target safe
  # to use and what lets a PR from a fork be labelled.
  #
  # `edited` also fires for a body or base-branch edit; those leave the labels
  # alone, so a label set by hand stays until the title changes.
  label:
    if: ${{ github.event.action != 'edited' || github.event.changes.title }}
    # One run per PR at a time: two overlapping runs would each read the
    # labels, then each edit, and could leave two managed labels behind. Set
    # on the job, after the condition above, so that a body edit, which skips
    # the job, cannot cancel a title edit's run.
    concurrency:
      group: label-by-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # The labels this workflow owns: one of them at a time, so a title
          # edited from feat to fix swaps the label rather than adding one. A
          # type not listed gets none of them and lands under Other.
          # `dependencies` is Dependabot's: added for a runtime bump raised by
          # hand, never removed. A dev bump keeps it and gets skip-changelog on
          # top, since release.yml's exclude wins over its categories.
          managed=(enhancement bug documentation skip-changelog)
          conventional='^([a-z]+)(\(([^)]*)\))?(!)?: '
          type=""
          scope=""
          breaking=""
          if [[ "$TITLE" =~ $conventional ]]; then
            type="${BASH_REMATCH[1]}"
            scope="${BASH_REMATCH[3]-}"
            breaking="${BASH_REMATCH[4]-}"
          fi
          case "$type" in
            feat|perf) wanted=enhancement ;;
            fix) wanted=bug ;;
            docs) wanted=documentation ;;
            build) if [ "$scope" = deps ]; then wanted=""; else wanted=skip-changelog; fi ;;
            ci|test|chore|refactor|style) wanted=skip-changelog ;;
            *) wanted="" ;;
          esac
          # A breaking change ships whatever its type, so it stays in the notes.
          if [ -n "$breaking" ] && [ "$wanted" = skip-changelog ]; then wanted=""; fi
          # One name per line, matched whole: label names may contain spaces.
          current=$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          args=()
          for label in "${managed[@]}"; do
            if grep -Fxq -- "$label" <<< "$current"; then has=1; else has=0; fi
            if [ "$label" = "$wanted" ] && [ "$has" = 0 ]; then args+=(--add-label "$label"); fi
            if [ "$label" != "$wanted" ] && [ "$has" = 1 ]; then args+=(--remove-label "$label"); fi
          done
          if [ "$type" = build ] && [ "$scope" = deps ] && ! grep -Fxq dependencies <<< "$current"; then
            args+=(--add-label dependencies)
          fi
          if [ "${#args[@]}" = 0 ]; then
            echo "#$NUMBER '$TITLE': nothing to change (${wanted:-no managed label})"
          else
            gh pr edit "$NUMBER" --repo "$REPO" "${args[@]}"
            echo "#$NUMBER '$TITLE': ${args[*]}"
          fi
