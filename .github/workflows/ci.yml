name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # package-lock.json is not committed (see .gitignore). Generate one for
      # this run, then install from it: npm ci gives a clean, reproducible
      # install within the run, while resolving fresh each time avoids the
      # drift class a committed lockfile creates. Same pattern as signalk-server.
      - name: Install
        run: |
          npm install --package-lock-only
          npm ci

      - name: Lint and format check
        run: npm run ci-lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
