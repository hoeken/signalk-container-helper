name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # npm ci, not npm install: it fails on a package.json/package-lock.json
      # mismatch instead of silently reconciling it, so lockfile drift surfaces
      # here rather than in the publish workflow, which also runs npm ci.
      - run: npm ci

      - name: Lint and format check
        run: npm run ci-lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
